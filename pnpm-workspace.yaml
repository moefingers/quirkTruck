# pnpm settings for this app (pnpm >= 10 reads them from here, not from
# package.json). Not a multi-package workspace. pnpm >= 11 refuses to install
# while a dependency's build script is unreviewed; these are all
# donation-banner postinstalls with no effect on the build, so they stay off.
allowBuilds:
  core-js: false
  core-js-pure: false
# Flat node_modules, laid out as npm laid it out when the museum built this
# app. webpack names modules and chunks from their node_modules paths, so the
# default isolated layout renames every emitted JS file; hoisted keeps the
# build byte-identical to the hosted copy. Packages stay hard-linked from the
# pnpm store.
nodeLinker: hoisted
